<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student - Search Tutor</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    
    body {    background: linear-gradient(135deg, #f0f9ff 0%, #e0e7ff 100%); }
    #search-box {
      width: 1050px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px gray;
    }
    #searchForm {
      display: flex;
      text-align: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    select, button {
      padding: 8px;
      margin: 5px;
      border-radius: 6px;
      border: 1px solid gray;
      background: white;
    }
    .tutor-card {
      margin-top: 15px;
      min-height: 190px;
      padding: 30px;
      border-radius: 10px;
      background: #e0e7ff;
     background: linear-gradient(135deg, #eff6ff, #f0f9ff);
      border: 1px solid #cbdcf3;
      line-height: 24px;
      border-style: solid;
     
   
      margin: 30px;
      text-align: center;
    }
    .tutor-card b { color:rgb(70, 70, 175); }
    .tutor-card img {
      border-radius: 50%;
      object-fit: cover;
      height: 40px; width: 40px;
    }
    .tutor-card button {
      background-color: rgb(108, 96, 218);
      color: white;
      border-radius: 12px;
      cursor: pointer;
      margin: 5px;
      padding: 10px 20px;
    }
  </style>
</head>
<body>
  <header>
    <h2 style="letter-spacing:1.2px;;">Smart Tuition Media</h2>
    <nav class="navi">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="admins.html">Admins</a>
      <a href="tutor.html">Tutor</a>
      <a href="contact.html">Contact</a>
      <a href="login.html" class="logout" onclick="logout()">Log out</a>
    </nav>
  </header>

  <div id="fake"></div>

  <div id="search-box">
    <h1 style="text-align:center;color:rgb(104, 74, 215);">🔍 Search Tutors</h1>
    <br/>
    <form id="searchForm">
      <select id="subject">
        <option value="">Select Subject</option>
        <option>Bangla</option><option>English</option><option>Math</option>
        <option>Higher Math</option><option>Physics</option><option>Chemistry</option>
        <option>Biology</option><option>Economics</option><option>Accounting</option>
        <option>ICT</option>
      </select>

      <select id="location">
        <option value=""> Any Location </option>
        <option>Surma</option><option>Akhalia</option><option>Amborkhana</option>
        <option>Zindabazar</option><option>Madina Market</option><option>Shibganj</option>
        <option>Tilagor</option><option>Kumarpara</option><option>Lama Bazar</option>
        <option>Bondor</option><option>Shahjalal Upashahar</option><option>Subidbazar</option>
        <option>Mirabazar</option><option>Pathantula</option><option>Uposhohor</option>
        <option>Kazir Bazar</option><option>Dargah Gate</option><option>Chowhatta</option>
        <option>Modina Tower</option><option>Shahporan</option><option>Housing Estate</option>
        <option>Majortila</option><option>Shahi Eidgah</option><option>Pirer Bazar</option>
        <option>Masimpur</option><option>Bagbari</option><option>Tilagarh Eco Park Area</option>
        <option>Shuktara</option><option>Noyasarak</option><option>Uposhohor Point</option>
        <option>Rikabibazar</option><option>Naya Sarak</option><option>Shahjalal University Area</option>
        <option>Khuliya</option><option>South Surma</option><option>Mukterpara</option>
        <option>Chalibandar</option>
      </select>

      <select id="salary">
        <option value="">Salary Range</option>
        <option>2000-4000</option>
        <option>4000-6000</option>
        <option>6000+</option>
      </select>

      <button type="submit">Search</button>
    </form>

    <div style="text-align: center; margin-top: 15px; padding: 10px; background: #fef2f2; border-radius: 8px; border-left: 4px solid #ef4444;">
      <p style="color: #dc2626; font-size: 14px; margin: 0;">
        <strong>N.B:</strong> If no tutor is found in your selected Location, then set the Location to <strong>"Any Location"</strong> and Search Again.
      </p>
    </div>

    <div id="results"></div>
  </div>

  <!-- Supabase CDN -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  
  <script>
    window.onload = function () {
      const user = JSON.parse(localStorage.getItem("currentUser"));
      if (!user) {
        alert("Please login as a student to access this page.");
        window.location.href = "login.html";
        return;
      }

      // Role check: show appropriate navigation
      if (user.role === "student") {
        // Students can search for tutors
        const tutorLink = document.querySelector('a[href="tutor.html"]');
        if (tutorLink) tutorLink.style.display = "none";
      } else if (user.role === "tutor") {
        // Tutors can manage their profile
        const studentLink = document.querySelector('a[href="student.html"]');
        if (studentLink) studentLink.style.display = "none";
      }
      
      console.log('User logged in:', user.name, 'Role:', user.role);

      // Load and show all tutors from Supabase
      loadTutors();
    };

    async function loadTutors(filters = {}) {
      const results = document.getElementById("results");
      utils.showLoading(results, 'Searching tutors...');
      
      try {
        const { data: tutors, error } = await db.getTutors(filters);
        
        if (error) {
          console.error('Database error:', error);
          utils.showError(results, 'Failed to load tutors: ' + error.message);
          return;
        }
        
        console.log('Found tutors:', tutors?.length || 0);
        renderTutors(tutors || []);
      } catch (error) {
        console.error('Error loading tutors:', error);
        utils.showError(results, 'Network error. Please try again.');
      }
    }

    function renderTutors(tutors){
      const results = document.getElementById("results");
      results.innerHTML = "";
      if (!tutors.length){
        results.innerHTML = "<p>No tutor found.</p>";
        return;
      }
      tutors.forEach(t => {
        const safeEmail = t.email ? t.email : "";
        results.innerHTML += `
          <div class="tutor-card">
            <img src="https://img.icons8.com/color/96/000000/student-male--v2.png" alt="tutor" />
            <h3>${t.name}</h3>
            <p><b>Varsity:</b> ${t.varsity}</p>
            <p><b>Subject:</b> ${t.subject}</p>
            <p><b>Location:</b> ${t.location}</p>
            <p><b>Salary:</b> ৳${t.salary}</p>
            <button onclick="viewProfile('${encodeURIComponent(t.name)}','${encodeURIComponent(safeEmail)}')">View Profile</button>
            <button onclick="handleChat('${encodeURIComponent(t.name)}','${encodeURIComponent(safeEmail)}')">Chat</button>
          </div>
        `;
      });
    }

    // Filter & search tutors
    document.getElementById("searchForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const subject = document.getElementById("subject").value;
      const location = document.getElementById("location").value;
      const salary = document.getElementById("salary").value;

      const filters = {};
      
      if (subject && subject.trim()) {
        filters.subject = subject.trim();
      }
      if (location && location.trim()) {
        filters.location = location.trim();
      }
      if (salary && salary.trim()) {
        if (salary === "2000-4000") {
          filters.minSalary = 2000;
          filters.maxSalary = 4000;
        } else if (salary === "4000-6000") {
          filters.minSalary = 4000;
          filters.maxSalary = 6000;
        } else if (salary === "6000+") {
          filters.minSalary = 6000;
        }
      }
      
      console.log('Search filters:', filters);

      loadTutors(filters);
    });

    // View tutor profile
    function viewProfile(encodedTutorName, encodedTutorEmail){
      const user = JSON.parse(localStorage.getItem("currentUser"));
      if (!user){
        alert("Please login first.");
        window.location.href = "login.html";
        return;
      }
      const hasEmail = encodedTutorEmail && decodeURIComponent(encodedTutorEmail) !== "";
      const q = `tutor-profile.html?name=${encodedTutorName}` + (hasEmail ? `&email=${encodedTutorEmail}` : "");
      window.location.href = q;
    }

    // Go to chat page
    function handleChat(encodedTutorName, encodedTutorEmail){
      const user = JSON.parse(localStorage.getItem("currentUser"));
      if (!user){
        alert("Please login first.");
        window.location.href = "login.html";
        return;
      }
      const hasEmail = encodedTutorEmail && decodeURIComponent(encodedTutorEmail) !== "";
      const q = `chat.html?toName=${encodedTutorName}` + (hasEmail ? `&toEmail=${encodedTutorEmail}` : "");
      window.location.href = q;
    }

    function logout(){
      localStorage.removeItem("currentUser");
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
